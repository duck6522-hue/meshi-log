<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="めしログ">
<meta name="description" content="食事と体重を端末の中だけに記録する、自分用のカロリー管理アプリ。">
<title>めしログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap">
<style>
  :root {
    --bg: #f4f5f9; --card: #fff; --field: #f1f2f7; --text: #1c1e26; --muted: #6b7080; --line: #e3e5ec;
    --danger: #d92d3a; --warn: #d9620a; --ok: #0a8f5b;
    --p1: #ffc400; --p2: #ff9100; --on: #3b2a00; --chart: #b86a00;
    --pt: color-mix(in srgb, var(--p2) 60%, #000);
    --tint: color-mix(in srgb, var(--p1) 22%, transparent);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161b; --card: #1f222a; --field: #2a2e38; --text: #e8e9ee; --muted: #9a9eab; --line: #2f333d; --danger: #ff6b76; --warn: #ffa24d; --ok: #3ddc97;
      --chart: #c47e00; --pt: color-mix(in srgb, var(--p1) 80%, #fff); --tint: color-mix(in srgb, var(--p1) 18%, transparent); color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Noto Sans JP", -apple-system, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; -webkit-tap-highlight-color: transparent; }
  .gut { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1, h2, h3, p, ul { margin: 0; padding: 0; }
  ul { list-style: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: var(--field); border-radius: 12px; padding: 8px 14px; font-weight: 700; }
  button:focus-visible, a:focus-visible, input:focus-visible, .pick input:focus-visible + span { outline: 2px solid var(--p2); outline-offset: 2px; }
  button.primary { background: linear-gradient(135deg, var(--p1), var(--p2)); color: var(--on); font-weight: 900; }
  button.wide { width: 100%; min-height: 50px; border-radius: 16px; font-size: 16px; }
  button.text { background: none; color: var(--muted); padding: 6px 8px; }
  button.text.danger, button.danger { color: var(--danger); }
  input[type=text], input[type=search], input[type=date], input[type=number] {
    background: var(--field); border: 1px solid transparent; border-radius: 14px; padding: 10px 14px; min-width: 0; width: 100%; height: 46px; font-size: 16px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ヘッダー + タブ */
  .appbar { position: sticky; top: 0; z-index: 10; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
  .top { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; padding-bottom: 4px; min-height: 52px; }
  h1 { font-size: 22px; font-weight: 900; letter-spacing: -1px; color: var(--pt); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; background: none; border-radius: 0; padding: 11px 2px 10px; color: var(--muted); position: relative; font-size: 14px; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--pt); font-weight: 900; }
  .tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 50%; bottom: -1px; width: 44px; height: 3px; border-radius: 3px 3px 0 0; background: linear-gradient(90deg, var(--p1), var(--p2)); transform: translateX(-50%); }
  main { padding-top: 14px; padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }

  /* 日付送り */
  .dnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .dnav > button { flex: none; width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 20px; line-height: 1; background: var(--card); }
  .dnav > button:disabled { opacity: .35; cursor: default; }
  .dnav .day { position: relative; flex: 1; text-align: center; font-size: 17px; font-weight: 900; padding: 8px 0; }
  .dnav .day input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; padding: 0; cursor: pointer; }
  .dnav .day small { display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 900; padding: 1px 9px; border-radius: 10px; color: var(--pt); background: var(--tint); vertical-align: 2px; }

  /* 集計カード */
  .summary { padding: 18px 22px; border-radius: 24px; color: var(--on); margin-bottom: 12px;
    background: linear-gradient(135deg, var(--p1), var(--p2)); box-shadow: 0 6px 16px color-mix(in srgb, var(--p2) 25%, transparent); }
  .summary .lab { font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; }
  .summary .big { font-size: 36px; font-weight: 900; letter-spacing: -1px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .summary .big small { font-size: 15px; font-weight: 700; letter-spacing: 0; margin-left: 6px; }
  .summary .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.5); margin-top: 10px; overflow: hidden; }
  .summary .bar i { display: block; height: 100%; border-radius: 4px; background: var(--on); transition: width .25s; }
  .summary .rest { margin-top: 6px; font-size: 13px; font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--card); border-radius: 18px; padding: 12px 14px; min-width: 0; }
  .stat span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
  .stat b { display: block; font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.5px; white-space: nowrap; }
  .stat b small { font-size: 12px; font-weight: 700; letter-spacing: 0; margin-left: 2px; }
  .stat > small { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter { display: block; height: 6px; border-radius: 3px; background: var(--field); margin: 6px 0 4px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--p1), var(--p2)); transition: width .25s; }

  /* カードと行 */
  .grp { margin-top: 16px; }
  .grp h2 { font-size: 13px; font-weight: 900; margin: 0 4px 6px; display: flex; align-items: center; gap: 8px; color: var(--muted); min-height: 40px; }
  .grp h2 b { color: var(--text); font-size: 15px; font-weight: 900; }
  .grp h2 .sp { flex: 1; }
  .grp h2 .add { flex: none; width: 40px; height: 40px; padding: 0; border-radius: 50%; font-size: 22px; line-height: 1; color: var(--pt); background: var(--tint); }
  .card { background: var(--card); border-radius: 18px; overflow: hidden; }
  .card.pad { padding: 14px 16px; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 8px 14px; border-top: 1px solid var(--line); background: none; border-radius: 0; text-align: left; font-weight: 400; }
  .row:first-child { border-top: 0; }
  .row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .row .tx b { font-weight: 700; overflow-wrap: anywhere; }
  .row .tx small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .row .kc { flex: none; font-weight: 900; font-variant-numeric: tabular-nums; text-align: right; }
  .row .kc small { font-weight: 700; font-size: 11px; color: var(--muted); margin-left: 2px; }
  .tag { flex: none; font-size: 11px; font-weight: 900; color: var(--pt); background: var(--tint); padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); padding: 18px 16px; font-size: 13px; }
  .empty b { display: block; font-size: 16px; color: var(--text); margin-bottom: 4px; }
  .sec { font-size: 13px; font-weight: 900; color: var(--muted); margin: 18px 4px 6px; }
  .note { color: var(--muted); font-size: 12px; }
  .bad { color: var(--danger); } .good { color: var(--ok); }

  /* 入力まわり */
  .f { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); min-width: 0; }
  .f > * { color: var(--text); }
  .f > span:first-child { color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .step { display: flex; gap: 6px; }
  .step button { flex: none; width: 48px; height: 48px; padding: 0; font-size: 20px; }
  .step input { text-align: center; font-weight: 900; font-size: 18px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .pick { position: relative; flex: none; }
  .pick input { position: absolute; opacity: 0; inset: 0; margin: 0; }
  .pick span { display: block; background: var(--field); border-radius: 18px; padding: 8px 14px; font-size: 14px; font-weight: 700; white-space: nowrap; cursor: pointer; }
  .pick input:checked + span { background: linear-gradient(135deg, var(--p1), var(--p2)); color: var(--on); }
  .seg { display: flex; background: var(--field); border-radius: 14px; padding: 3px; }
  .seg .pick { flex: 1; }
  .seg .pick span { background: none; text-align: center; border-radius: 11px; padding: 8px 4px; }
  .acts { display: flex; gap: 10px; align-items: center; }
  .acts .primary { flex: 1; min-height: 48px; border-radius: 14px; font-size: 16px; }
  .calc { background: var(--tint); border-radius: 16px; padding: 12px 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .calc b { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .calc b small { font-size: 13px; font-weight: 700; margin-left: 3px; letter-spacing: 0; }
  .calc span { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }

  /* シート */
  dialog { margin: auto auto 0; width: 100%; max-width: 760px; max-height: 92dvh; border: 0; padding: 0; border-radius: 24px 24px 0 0; background: var(--card); color: var(--text); overflow: auto; }
  dialog.tall { height: 92dvh; }
  dialog::backdrop { background: rgba(10,12,18,.5); }
  @media (min-width: 800px) { dialog { margin: auto; border-radius: 24px; } }
  .sheet { padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
  .sheet h2 { font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: space-between; gap: 8px; overflow-wrap: anywhere; }
  .sheet h2 button { flex: none; }
  .sheet .card { background: var(--field); }
  .results { margin: 0 -6px; }
  .results .row { padding: 8px 6px; }

  /* 体重グラフ */
  .chart { position: relative; touch-action: pan-y; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .tip { position: absolute; top: 0; pointer-events: none; background: #23262f; color: #fff; border-radius: 10px; padding: 4px 10px; font-size: 12px; white-space: nowrap; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
  .tip b { font-size: 14px; margin-left: 6px; }

  textarea { background: var(--field); border: 1px solid transparent; border-radius: 14px; padding: 10px 14px; width: 100%; font-size: 15px; line-height: 1.6; resize: vertical; }
  textarea:focus-visible { outline: 2px solid var(--p2); outline-offset: 2px; }
  .sug { display: flex; gap: 8px; overflow-x: auto; padding: 8px 2px 2px; scrollbar-width: none; }
  .sug::-webkit-scrollbar { display: none; }
  .chip { flex: none; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 6px 12px; font-size: 13px; white-space: nowrap; min-height: 36px; }
  .chip.mem { border-color: color-mix(in srgb, var(--p2) 45%, var(--line)); background: var(--tint); color: var(--pt); }
  .chip small { font-weight: 400; margin-left: 4px; opacity: .85; }
  .week { position: relative; display: flex; gap: 6px; height: 110px; padding-bottom: 20px; }
  .week .goal { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--muted); pointer-events: none; }
  .wd { flex: 1; height: 100%; background: none; padding: 0; border-radius: 6px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
  .wd .bar { width: 100%; max-width: 28px; min-height: 2px; border-radius: 4px 4px 0 0; background: color-mix(in srgb, var(--muted) 45%, var(--card)); }
  .wd.on .bar { background: linear-gradient(180deg, var(--p1), var(--p2)); }
  .wd small { position: absolute; bottom: -20px; font-size: 11px; font-weight: 700; color: var(--muted); }
  .wd.on small { color: var(--pt); font-weight: 900; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30;
    background: #23262f; color: #fff; border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100vw - 32px); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 14px; }
  .toast button { background: rgba(255,255,255,.16); color: #fff; flex: none; }
</style>
</head>
<body>
<div class="appbar">
  <div class="top gut"><h1>めしログ</h1></div>
  <div class="tabs gut" role="tablist">
    <button role="tab" data-act="tab" data-view="today" aria-selected="true">きょう</button>
    <button role="tab" data-act="tab" data-view="weight" aria-selected="false">体重</button>
    <button role="tab" data-act="tab" data-view="foods" aria-selected="false">マイ食品</button>
    <button role="tab" data-act="tab" data-view="settings" aria-selected="false">設定</button>
  </div>
</div>

<main class="gut">
  <section id="v-today"></section>
  <section id="v-weight" hidden></section>
  <section id="v-foods" hidden></section>
  <section id="v-settings" hidden></section>
</main>

<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastUndo" data-act="undo">元に戻す</button></div>
<dialog id="sheet"><form class="sheet" id="sheetForm" method="dialog" autocomplete="off"></form></dialog>

<script>
'use strict';
/* ---------- 共通 ---------- */
const KEY = 'meshi.v1', VIEW_KEY = 'meshi.view';
const VIEWS = ['today', 'weight', 'foods', 'settings'];
const MEALS = [['breakfast', '朝食'], ['lunch', '昼食'], ['dinner', '夕食'], ['snack', '間食']];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s).normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/\s+/g, '');
const pad = n => String(n).padStart(2, '0');
const dayStr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = dayDate(s); d.setDate(d.getDate() + n); return dayStr(d); };
const isDay = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && dayStr(dayDate(s)) === s;
const r1 = n => Math.round(n * 10) / 10;
const fmt = n => r1(n).toLocaleString('ja-JP', { maximumFractionDigits: 1 });
const kc = n => Math.round(n).toLocaleString('ja-JP');
const numOr = (v, d) => (v === '' || v === null || v === undefined || !Number.isFinite(+v)) ? d : +v;

/* ---------- 保存（この端末の localStorage だけ） ---------- */
const fresh = () => ({ v: 1, settings: { kcal: 2000, weightGoal: null, pfc: { p: 20, f: 25, c: 55 }, recipe: { prefs: '', template: '' } }, meals: {}, weights: {}, custom: [], sets: [], recent: [] });
const item = e => ({ foodId: e.foodId ?? null, name: String(e.name), grams: +e.grams, qty: numOr(e.qty, +e.grams), unit: String(e.unit || 'g'), unitG: numOr(e.unitG, 1),
  kcal: numOr(e.kcal, 0), p: numOr(e.p, 0), f: numOr(e.f, 0), c: numOr(e.c, 0) });
const validItem = e => e && e.name && numOr(e.grams, -1) >= 0;
function normalize(s) {
  const f = fresh();
  if (!s || typeof s !== 'object') return f;
  const st = s.settings || {}, pfc = st.pfc || {};
  f.settings.kcal = Math.max(1, numOr(st.kcal, 2000));
  f.settings.weightGoal = numOr(st.weightGoal, null);
  const p = numOr(pfc.p, 20), ft = numOr(pfc.f, 25), c = numOr(pfc.c, 55);
  if (p >= 0 && ft >= 0 && c >= 0 && Math.round(p + ft + c) === 100) f.settings.pfc = { p, f: ft, c };
  for (const [d, list] of Object.entries(s.meals || {})) {
    if (!isDay(d) || !Array.isArray(list)) continue;
    const ok = list.filter(e => validItem(e) && MEALS.some(m => m[0] === e.meal)).map(e => ({ id: String(e.id || uid()), meal: e.meal, ...item(e) }));
    if (ok.length) f.meals[d] = ok;
  }
  for (const [d, w] of Object.entries(s.weights || {})) if (isDay(d) && numOr(w, 0) > 0) f.weights[d] = +w;
  f.custom = (Array.isArray(s.custom) ? s.custom : []).filter(x => x && x.name).map(x => ({
    id: String(x.id || 'c:' + uid()), name: String(x.name), kcal: numOr(x.kcal, 0), p: numOr(x.p, 0), f: numOr(x.f, 0), c: numOr(x.c, 0),
    unitLabel: String(x.unitLabel || ''), unitG: numOr(x.unitG, 0) }));
  const rc = st.recipe || {};
  f.settings.recipe = { prefs: String(rc.prefs || '').slice(0, 2000), template: String(rc.template || '').slice(0, 6000) };
  f.sets = (Array.isArray(s.sets) ? s.sets : []).filter(x => x && x.name && Array.isArray(x.items))
    .map(x => ({ id: String(x.id || uid()), name: String(x.name), items: x.items.filter(validItem).map(item) })).filter(x => x.items.length);
  f.recent = (Array.isArray(s.recent) ? s.recent : []).filter(x => x && x.id != null).slice(0, 30);
  return f;
}
function load() { try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {} return fresh(); }
let saveOk = true, memCache = null;
function save() {
  memCache = null;
  try { localStorage.setItem(KEY, JSON.stringify(state)); saveOk = true; }
  catch (e) { if (saveOk) toast('この端末に保存できませんでした（プライベートブラウズ中かもしれません）'); saveOk = false; }
}
let state = load();
let view = 'today', undoSnap = null, sheetCtx = null;
try { const v = localStorage.getItem(VIEW_KEY); if (VIEWS.includes(v)) view = v; } catch (e) {}

/* ---------- 食品データ（foods.json：日本食品標準成分表 八訂） ---------- */
let DB = null, dbError = false;
async function loadDB() {
  try {
    const j = await (await fetch('foods.json')).json();
    const map = new Map(), list = [];
    for (const [id, name, kcal, p, f, c] of j.foods) {
      const short = name.replace(/^(<[^>]+>\s*)?(\([^)]*類\)\s*)?/, '');
      const fd = { id, name: short, official: name, kcal, p, f, c, units: [], common: false, key: norm(name) };
      map.set(id, fd); list.push(fd);
    }
    for (const cm of j.common) {
      const fd = map.get(cm.id); if (!fd) continue;
      fd.name = cm.n; fd.units = cm.u; fd.common = true; fd.key = norm(cm.n + cm.k + fd.official);
    }
    DB = { map, list, source: j.source };
  } catch (e) { dbError = true; }
  render();
}
const customFood = x => ({ id: x.id, name: x.name, official: '', kcal: x.kcal, p: x.p, f: x.f, c: x.c, custom: true,
  units: x.unitG > 0 ? [[x.unitLabel || '1食分', x.unitG]] : [], key: norm(x.name) });
function foodById(id) {
  if (typeof id === 'string' && id.startsWith('c:')) { const x = state.custom.find(c => c.id === id); return x ? customFood(x) : null; }
  return DB ? DB.map.get(id) || null : null;
}
const per100 = fd => `100gあたり ${kc(fd.kcal)}kcal・P${fmt(fd.p)} F${fmt(fd.f)} C${fmt(fd.c)}`;

/* ---------- 目標 ---------- */
function targets() {
  const { kcal, pfc } = state.settings;
  return { kcal, p: kcal * pfc.p / 100 / 4, f: kcal * pfc.f / 100 / 9, c: kcal * pfc.c / 100 / 4 };
}

/* ---------- 画面の切り替え ---------- */
const views = {};   // 各画面の描画関数
const acts = {};    // data-act ごとの処理
const submits = {}; // シートの種類ごとの送信処理
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === view));
  for (const v of VIEWS) $('#v-' + v).hidden = v !== view;
  if (views[view]) views[view]($('#v-' + view));
}
acts.tab = el => { view = el.dataset.view; try { localStorage.setItem(VIEW_KEY, view); } catch (e) {} render(); window.scrollTo(0, 0); };

/* ---------- シートとトースト ---------- */
function openSheet(html, ctx, tall) {
  sheetCtx = ctx; $('#sheetForm').innerHTML = html;
  const d = $('#sheet'); d.classList.toggle('tall', !!tall);
  if (!d.open) d.showModal();
  d.scrollTop = 0;
}
function closeSheet() { const d = $('#sheet'); if (d.open) d.close(); sheetCtx = null; }
acts.close = closeSheet;
let toastTimer = 0;
function toast(msg, undo) {
  $('#toastMsg').textContent = msg; $('#toastUndo').hidden = !undo; $('#toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('#toast').hidden = true; undoSnap = null; }, undo ? 6000 : 2600);
}
const snap = () => { undoSnap = JSON.stringify(state); };
acts.undo = () => { if (!undoSnap) return; state = normalize(JSON.parse(undoSnap)); undoSnap = null; save(); $('#toast').hidden = true; render(); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = acts[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON') e.preventDefault();
  fn(el, e);
});
$('#sheetForm').addEventListener('submit', e => {
  e.preventDefault();
  const fn = sheetCtx && submits[sheetCtx.type];
  if (fn) fn(new FormData(e.target), sheetCtx);
});
$('#sheet').addEventListener('click', e => { if (e.target === $('#sheet')) closeSheet(); });
$('#sheet').addEventListener('close', () => { sheetCtx = null; });

/* ---------- きょう（1日の記録） ---------- */
let curDay = dayStr();
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const dayLabel = s => { const d = dayDate(s); return `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const mealName = m => (MEALS.find(x => x[0] === m) || MEALS[0])[1];
function sumEntries(list) {
  const t = { kcal: 0, p: 0, f: 0, c: 0 };
  for (const e of list) for (const k in t) t[k] += e[k] * e.grams / 100;
  return t;
}
const amountText = e => e.unit === 'g' ? `${fmt(e.grams)}g` : `${e.unit}×${fmt(e.qty)}（${fmt(e.grams)}g）`;
const pfcText = t => `P${fmt(t.p)} F${fmt(t.f)} C${fmt(t.c)}`;
const pct = (v, goal) => goal > 0 ? Math.min(100, Math.max(0, v / goal * 100)) : 0;

views.today = el => {
  const today = dayStr(), list = state.meals[curDay] || [], t = sumEntries(list), g = targets(), rest = g.kcal - t.kcal;
  const tile = (label, v, goal) => `<div class="stat"><span>${label}</span><b>${fmt(v)}<small>g</small></b>
    <span class="meter" role="progressbar" aria-label="${label}" aria-valuemin="0" aria-valuemax="${Math.round(goal)}" aria-valuenow="${Math.round(v)}"><i style="width:${pct(v, goal)}%"></i></span>
    <small>目標 ${Math.round(goal)}g</small></div>`;
  const meals = MEALS.map(([m, name]) => {
    const items = list.filter(e => e.meal === m), mt = sumEntries(items);
    const prev = items.length ? [] : (state.meals[addDays(curDay, -1)] || []).filter(e => e.meal === m);
    const chips = suggest(m, list).map(r => `<button class="chip mem" data-act="quick" data-meal="${m}" data-id="${esc(r.id)}">＋ ${esc(r.name)}<small>${esc(amountShort(r.by[m].e))}</small></button>`).join('')
      + (prev.length ? `<button class="chip" data-act="copy-prev" data-meal="${m}">前日の${name}をコピー<small>${prev.length}品</small></button>` : '')
      + (items.length >= 2 ? `<button class="chip" data-act="save-set" data-meal="${m}">この組み合わせをセットに保存</button>` : '');
    const rows = items.map(e => { const et = sumEntries([e]); return `<button class="row" data-act="edit-entry" data-id="${esc(e.id)}">
      <span class="tx"><b>${esc(e.name)}</b><small>${esc(amountText(e))}・${pfcText(et)}</small></span>
      <span class="kc">${kc(et.kcal)}<small>kcal</small></span></button>`; }).join('');
    return `<div class="grp"><h2><b>${name}</b><span class="num">${items.length ? kc(mt.kcal) + ' kcal' : ''}</span><span class="sp"></span>
      <button class="add" data-act="add-food" data-meal="${m}" aria-label="${name}に追加">＋</button></h2>
      <div class="card">${rows || '<div class="empty">まだ記録がありません</div>'}</div>
      ${chips ? `<div class="sug">${chips}</div>` : ''}</div>`;
  }).join('');
  el.innerHTML = `
    <div class="dnav">
      <button data-act="day" data-d="-1" aria-label="前の日">‹</button>
      <div class="day">${dayLabel(curDay)}${curDay === today ? '<small>きょう</small>' : ''}<input type="date" id="dayPick" value="${curDay}" max="${today}" aria-label="日付を選ぶ"></div>
      <button data-act="day" data-d="1" aria-label="次の日" ${curDay >= today ? 'disabled' : ''}>›</button>
    </div>
    <div class="summary">
      <div class="lab"><span>摂取カロリー</span><span class="num">目標 ${kc(g.kcal)} kcal</span></div>
      <div class="big">${kc(t.kcal)}<small>kcal</small></div>
      <div class="bar" role="progressbar" aria-label="カロリー" aria-valuemin="0" aria-valuemax="${Math.round(g.kcal)}" aria-valuenow="${Math.round(t.kcal)}"><i style="width:${pct(t.kcal, g.kcal)}%"></i></div>
      <div class="rest num">${rest >= 0 ? `あと ${kc(rest)} kcal` : `${kc(-rest)} kcal オーバー`}</div>
    </div>
    <div class="stats">${tile('たんぱく質', t.p, g.p)}${tile('脂質', t.f, g.f)}${tile('炭水化物', t.c, g.c)}</div>
    ${meals}
    ${weekCard()}
    <button class="wide" data-act="recipe" style="margin-top:20px;background:var(--card)">🍳 残りカロリーに合うレシピをAIに相談</button>`;
};
acts.day = el => { const d = addDays(curDay, +el.dataset.d); if (d <= dayStr()) { curDay = d; render(); } };
document.addEventListener('change', e => {
  if (e.target.id === 'dayPick' && isDay(e.target.value) && e.target.value <= dayStr()) { curDay = e.target.value; render(); }
});

/* ---------- 食品をさがす ---------- */
const parseId = s => s.startsWith('c:') ? s : +s;
function searchFoods(q) {
  const toks = q.normalize('NFKC').trim().split(/\s+/).map(norm).filter(Boolean);
  if (!toks.length) return [];
  const hits = [];
  for (const fd of [...state.custom.map(customFood), ...(DB ? DB.list : [])]) {
    if (!toks.every(t => fd.key.includes(t))) continue;
    const nm = norm(fd.name);
    // マイ食品 → 通称つきの定番 → 成分表のその他、の順。名前の先頭で一致したものを上に
    hits.push([(fd.custom ? 0 : fd.common ? 1 : 2) * 10 + (nm.startsWith(toks[0]) ? 0 : nm.includes(toks[0]) ? 1 : 2), fd.name.length, fd]);
  }
  return hits.sort((a, b) => a[0] - b[0] || a[1] - b[1]).slice(0, 60).map(h => h[2]);
}
const foodRow = fd => `<button class="row" data-act="pick-food" data-id="${esc(fd.id)}">
  <span class="tx"><b>${esc(fd.name)}</b><small>${per100(fd)}</small></span>${fd.custom ? '<span class="tag">マイ食品</span>' : ''}</button>`;
function renderResults() {
  const box = $('#qRes'); if (!box) return;
  const q = $('#q').value.trim();
  const status = dbError ? '<p class="note">同梱の食品データを読み込めませんでした。マイ食品は使えます。</p>' : !DB ? '<p class="note">食品データを読み込み中…</p>' : '';
  if (!q) {
    const recent = state.recent.map(r => foodById(r.id)).filter(Boolean).slice(0, 12), mine = state.custom.map(customFood);
    const often = [...memory().values()].filter(r => r.by[sheetCtx.meal]).sort((a, b) => b.by[sheetCtx.meal].n - a.by[sheetCtx.meal].n).slice(0, 8).map(r => foodById(r.id)).filter(Boolean);
    box.innerHTML = status
      + (state.sets.length ? `<p class="sec">マイセット</p><div class="results">${state.sets.map(setRow('add-set')).join('')}</div>` : '')
      + (often.length ? `<p class="sec">${mealName(sheetCtx.meal)}によく食べる</p><div class="results">${often.map(foodRow).join('')}</div>` : '')
      + (recent.length ? `<p class="sec">最近使った食品</p><div class="results">${recent.map(foodRow).join('')}</div>` : '')
      + (mine.length ? `<p class="sec">マイ食品</p><div class="results">${mine.map(foodRow).join('')}</div>` : '')
      + (!recent.length && !mine.length ? '<div class="empty"><b>食品名を入力してください</b>ひらがなでも探せます（例：ごはん、とりむね、なっとう）</div>' : '');
    return;
  }
  const hits = searchFoods(q);
  box.innerHTML = status + (hits.length ? `<div class="results">${hits.map(foodRow).join('')}</div>` : '<div class="empty"><b>見つかりませんでした</b>別の呼び方で試すか、マイ食品として登録できます</div>')
    + `<button type="button" class="wide" data-act="new-custom" data-name="${esc(q)}" style="margin-top:12px">「${esc(q)}」をマイ食品として登録</button>`;
}
function openSearch(meal) {
  openSheet(`<h2>${mealName(meal)}に追加<button type="button" class="text" data-act="close">閉じる</button></h2>
    <input type="search" id="q" placeholder="食品名でさがす（例：ごはん、とりむね）" enterkeyhint="search" aria-label="食品名でさがす">
    <div id="qRes"></div>`, { type: 'search', meal }, true);
  renderResults();
}
acts['add-food'] = el => openSearch(el.dataset.meal);
acts['pick-food'] = el => { const fd = foodById(parseId(el.dataset.id)); if (fd) openAmount(fd, { meal: sheetCtx && sheetCtx.meal || 'breakfast' }); };
submits.search = () => { $('#q').blur(); };

/* ---------- 量を決めて記録する ---------- */
function openAmount(fd, { meal, entry }) {
  const units = [['g', 1], ...fd.units.filter(u => u[1] > 0)];
  let idx, qty;
  if (entry) {
    idx = entry.unit === 'g' ? 0 : units.findIndex(u => u[0] === entry.unit && u[1] === entry.unitG);
    if (idx < 0) { units.push([entry.unit, entry.unitG]); idx = units.length - 1; }
    qty = entry.qty;
  } else {
    const last = state.recent.find(r => r.id === fd.id);
    idx = last ? units.findIndex(u => u[0] === last.unit) : -1;
    if (idx >= 0) qty = last.qty; else if (units.length > 1) { idx = 1; qty = 1; } else { idx = 0; qty = 100; }
  }
  openSheet(`<h2>${esc(fd.name)}<button type="button" class="text" data-act="close">閉じる</button></h2>
    <p class="note">${fd.official && fd.official !== fd.name ? esc(fd.official) + '<br>' : ''}${per100(fd)}</p>
    <div class="f"><span>単位</span><div class="chips">${units.map((u, i) => `<label class="pick"><input type="radio" name="unit" value="${i}" ${i === idx ? 'checked' : ''}><span>${i ? `${esc(u[0])}（${fmt(u[1])}g）` : 'g'}</span></label>`).join('')}</div></div>
    <div class="f"><span>量</span><div class="step">
      <button type="button" data-act="qty" data-d="-1" aria-label="減らす">−</button>
      <input type="number" name="qty" inputmode="decimal" step="any" min="0" required value="${r1(qty)}" aria-label="量">
      <button type="button" data-act="qty" data-d="1" aria-label="増やす">＋</button></div></div>
    <div class="calc" id="calc" aria-live="polite"></div>
    <div class="f"><span>食事</span><div class="seg">${MEALS.map(([m, n]) => `<label class="pick"><input type="radio" name="meal" value="${m}" ${m === meal ? 'checked' : ''}><span>${n}</span></label>`).join('')}</div></div>
    <div class="acts">${entry ? '<button type="button" class="text danger" data-act="del-entry">削除</button>' : ''}<button class="primary">${entry ? '保存する' : '記録する'}</button></div>`,
    { type: 'amount', fd, units, idx, entry, date: curDay });
  updateCalc();
}
function readAmount() {
  const f = $('#sheetForm'), u = sheetCtx.units[+f.elements.unit.value] || sheetCtx.units[0], qty = Math.max(0, numOr(f.elements.qty.value, 0));
  return { unit: u[0], unitG: u[1], qty, grams: qty * u[1] };
}
function updateCalc() {
  const a = readAmount(), fd = sheetCtx.fd, k = a.grams / 100;
  $('#calc').innerHTML = `<b>${kc(fd.kcal * k)}<small>kcal</small></b><span>${fmt(a.grams)}g・${pfcText({ p: fd.p * k, f: fd.f * k, c: fd.c * k })}</span>`;
}
acts.qty = el => {
  const inp = $('#sheetForm').elements.qty, a = readAmount(), stepSize = a.unit === 'g' ? 10 : 0.5;
  inp.value = Math.max(0, r1(a.qty + stepSize * +el.dataset.d)); updateCalc();
};
$('#sheetForm').addEventListener('input', e => {
  if (!sheetCtx) return;
  if (sheetCtx.type === 'search' && e.target.id === 'q') renderResults();
  if (sheetCtx.type === 'amount') {
    if (e.target.name === 'unit') { // 単位を替えたら量も合わせる（g に戻すときは同じ重さ、単位にするときは1つ）
      const f = $('#sheetForm'), prev = sheetCtx.units[sheetCtx.idx], now = +e.target.value;
      f.elements.qty.value = now === 0 ? r1(numOr(f.elements.qty.value, 0) * prev[1]) : 1;
      sheetCtx.idx = now;
    }
    updateCalc();
  }
});
submits.amount = (form, ctx) => {
  const a = readAmount(), fd = ctx.fd, meal = form.get('meal');
  if (!(a.grams > 0)) { toast('量を入力してください'); return; }
  const e = { id: ctx.entry ? ctx.entry.id : uid(), meal, foodId: fd.id, name: fd.name, grams: a.grams, qty: a.qty, unit: a.unit, unitG: a.unitG, kcal: fd.kcal, p: fd.p, f: fd.f, c: fd.c };
  const list = state.meals[ctx.date] || (state.meals[ctx.date] = []);
  const i = ctx.entry ? list.findIndex(x => x.id === ctx.entry.id) : -1;
  if (i >= 0) list[i] = e; else list.push(e);
  if (fd.id != null) state.recent = [{ id: fd.id, unit: a.unit, qty: a.qty }, ...state.recent.filter(r => r.id !== fd.id)].slice(0, 30);
  save(); closeSheet(); render(); toast(ctx.entry ? '保存しました' : `${mealName(meal)}に記録しました`);
};
acts['edit-entry'] = el => {
  const e = (state.meals[curDay] || []).find(x => x.id === el.dataset.id); if (!e) return;
  const src = foodById(e.foodId);
  // 栄養値は記録したときのものを使う。単位の候補だけ今の食品データから借りる
  openAmount({ id: e.foodId, name: e.name, official: '', kcal: e.kcal, p: e.p, f: e.f, c: e.c, units: src ? src.units : [] }, { meal: e.meal, entry: e });
};
acts['del-entry'] = () => {
  const { entry, date } = sheetCtx; snap();
  state.meals[date] = (state.meals[date] || []).filter(x => x.id !== entry.id);
  if (!state.meals[date].length) delete state.meals[date];
  save(); closeSheet(); render(); toast('記録を削除しました', true);
};

/* ---------- マイ食品（手入力で登録する食品） ---------- */
views.foods = el => {
  const rows = state.custom.map(x => { const fd = customFood(x); return `<button class="row" data-act="edit-custom" data-id="${esc(x.id)}">
    <span class="tx"><b>${esc(x.name)}</b><small>${per100(fd)}${x.unitG > 0 ? `・${esc(x.unitLabel || '1食分')} ${fmt(x.unitG)}g` : ''}</small></span></button>`; }).join('');
  const mem = [...memory().values()].sort((a, b) => b.n - a.n || (a.last < b.last ? 1 : -1)).slice(0, 20).map(r => {
    const top = MEALS.map(m => [r.by[m[0]] ? r.by[m[0]].n : 0, m[1]]).sort((a, b) => b[0] - a[0])[0];
    return `<button class="row" data-act="mem-add" data-id="${esc(r.id)}"><span class="tx"><b>${esc(r.name)}</b><small>${r.n}回・最後は ${md(r.last)}・${top[1]}が多い</small></span><span class="tag">＋ 記録</span></button>`; }).join('');
  el.innerHTML = `<button class="primary wide" data-act="new-custom">＋ 食品を登録</button>
    <p class="sec">登録した食品（${state.custom.length}）</p>
    <div class="card">${rows || '<div class="empty"><b>まだありません</b>よく食べる商品や自炊メニューを、パッケージの栄養成分表示を見ながら登録できます</div>'}</div>
    <p class="note" style="margin:8px 4px 0">登録した食品は、食事を追加するときの検索でいちばん上に出ます。</p>
    <p class="sec">マイセット（${state.sets.length}）</p>
    <div class="card">${state.sets.map(setRow('edit-set')).join('') || '<div class="empty">「きょう」で2品以上を記録すると、その組み合わせをセットに保存できます</div>'}</div>
    <p class="sec">よく食べる食品（メモリー）</p>
    <div class="card">${mem || '<div class="empty">記録がたまると、よく食べるものがここに並びます</div>'}</div>
    <p class="note" style="margin:8px 4px 0">同じ食事で2回以上食べたものは、「きょう」の各食事の下に「いつもの」として出ます。</p>`;
};
const numField = (label, name, v, req) => `<label class="f"><span>${label}</span><input type="number" name="${name}" inputmode="decimal" step="any" min="0" ${req ? 'required' : ''} value="${v ?? ''}"></label>`;
function openCustom(x, then) {
  openSheet(`<h2>${x && x.id ? 'マイ食品を編集' : 'マイ食品を登録'}<button type="button" class="text" data-act="close">閉じる</button></h2>
    <label class="f"><span>名前</span><input type="text" name="name" required maxlength="60" value="${esc(x ? x.name : '')}"></label>
    <div class="f"><span>栄養成分をどの量で入力するか</span><div class="seg">
      <label class="pick"><input type="radio" name="basis" value="100" checked><span>100gあたり</span></label>
      <label class="pick"><input type="radio" name="basis" value="unit"><span>1食分あたり</span></label></div></div>
    <div class="two">
      <label class="f"><span>1食分の呼び方（任意）</span><input type="text" name="unitLabel" maxlength="12" placeholder="1個、1袋 など" value="${esc(x ? x.unitLabel : '')}"></label>
      ${numField('1食分の重さ g（任意）', 'unitG', x && x.unitG ? r1(x.unitG) : '')}
    </div>
    <div class="two">${numField('エネルギー kcal', 'kcal', x && x.id ? r1(x.kcal) : '', true)}${numField('たんぱく質 g', 'p', x && x.id ? r1(x.p) : '')}</div>
    <div class="two">${numField('脂質 g', 'f', x && x.id ? r1(x.f) : '')}${numField('炭水化物 g', 'c', x && x.id ? r1(x.c) : '')}</div>
    <p class="note">パッケージの栄養成分表示をそのまま写せます。「1食分あたり」で入力するときは、1食分の重さも入れてください。</p>
    <div class="acts">${x && x.id ? '<button type="button" class="text danger" data-act="del-custom">削除</button>' : ''}<button class="primary">保存する</button></div>`,
    { type: 'custom', id: x && x.id || null, then });
}
acts['new-custom'] = el => openCustom(el.dataset.name ? { name: el.dataset.name, unitLabel: '', unitG: 0 } : null, sheetCtx && sheetCtx.type === 'search' ? { meal: sheetCtx.meal } : null);
acts['edit-custom'] = el => { const x = state.custom.find(c => c.id === el.dataset.id); if (x) openCustom(x, null); };
submits.custom = (form, ctx) => {
  const name = String(form.get('name')).trim(), unitG = Math.max(0, numOr(form.get('unitG'), 0)), perUnit = form.get('basis') === 'unit';
  if (!name) { toast('名前を入力してください'); return; }
  if (perUnit && !(unitG > 0)) { toast('1食分の重さ（g）を入力してください'); return; }
  const k = perUnit ? 100 / unitG : 1, v = n => Math.round(Math.max(0, numOr(form.get(n), 0)) * k * 100) / 100;
  const x = { id: ctx.id || 'c:' + uid(), name, kcal: v('kcal'), p: v('p'), f: v('f'), c: v('c'), unitLabel: String(form.get('unitLabel')).trim(), unitG };
  const i = state.custom.findIndex(c => c.id === x.id);
  if (i >= 0) state.custom[i] = x; else state.custom.unshift(x);
  save(); render();
  if (ctx.then) openAmount(customFood(x), { meal: ctx.then.meal }); else { closeSheet(); toast('保存しました'); }
};
acts['del-custom'] = () => {
  const id = sheetCtx.id; snap();
  state.custom = state.custom.filter(c => c.id !== id); state.recent = state.recent.filter(r => r.id !== id);
  save(); closeSheet(); render(); toast('マイ食品を削除しました（過去の記録は残ります）', true);
};

/* ---------- 体重 ---------- */
const RANGES = [[30, '30日'], [90, '90日'], [365, '1年'], [0, 'すべて']];
let wRange = 90, wDate = dayStr();
const sg = n => (n > 0.04 ? '+' : n < -0.04 ? '−' : '±') + fmt(Math.abs(n));
const md = (s, withYear) => { const d = dayDate(s); return (withYear ? d.getFullYear() + '/' : '') + (d.getMonth() + 1) + '/' + d.getDate(); };
views.weight = el => {
  const today = dayStr(), goal = state.settings.weightGoal;
  if (wDate > today) wDate = today;
  const all = Object.entries(state.weights).map(([d, w]) => ({ d, w })).sort((a, b) => a.d < b.d ? -1 : 1);
  const pts = wRange ? all.filter(x => x.d >= addDays(today, 1 - wRange)) : all;
  const last = all[all.length - 1], cur = state.weights[wDate];

function drawWeightChart(box, pts, goal) {
  if (!pts.length) { box.innerHTML = '<div class="empty">この期間の記録はありません</div>'; return; }
  const W = Math.max(280, box.clientWidth || 340), H = 220, m = { l: 38, r: 16, t: 16, b: 26 };
  const ws = pts.map(x => x.w), t0 = dayDate(pts[0].d).getTime(), t1 = dayDate(pts[pts.length - 1].d).getTime();
  let lo = Math.min(...ws), hi = Math.max(...ws);
  const showGoal = goal != null && goal >= lo - 5 && goal <= hi + 5; // 離れすぎた目標は線を出さず、推移を読みやすく保つ
  if (showGoal) { lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
  const step = [0.5, 1, 2, 5, 10, 20].find(s => Math.max(hi - lo, 1) / s <= 4) || 50;
  lo = Math.floor(lo / step + 1e-9) * step; hi = Math.ceil(hi / step - 1e-9) * step; if (hi <= lo) hi = lo + step;
  const x = d => t1 === t0 ? (m.l + W - m.r) / 2 : m.l + (dayDate(d).getTime() - t0) / (t1 - t0) * (W - m.l - m.r);
  const y = w => m.t + (hi - w) / (hi - lo) * (H - m.t - m.b);
  let grid = '';
  for (let v = lo; v <= hi + 1e-9; v += step) grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  const years = pts[0].d.slice(0, 4) !== pts[pts.length - 1].d.slice(0, 4);
  const xl = t1 === t0 ? `<text x="${x(pts[0].d)}" y="${H - 6}" text-anchor="middle">${md(pts[0].d)}</text>`
    : `<text x="${m.l}" y="${H - 6}">${md(pts[0].d, years)}</text><text x="${W - m.r}" y="${H - 6}" text-anchor="end">${md(pts[pts.length - 1].d, years)}</text>`;
  const gl = showGoal ? `<line x1="${m.l}" x2="${W - m.r}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--muted)" stroke-dasharray="4 4"/>
    <text x="${W - m.r}" y="${y(goal) - 5}" text-anchor="end">目標 ${fmt(goal)}</text>` : '';
  const dot = (p, r) => `<circle cx="${x(p.d)}" cy="${y(p.w)}" r="${r}" fill="var(--chart)" stroke="var(--card)" stroke-width="2"/>`;
  const dots = pts.length <= 40 ? pts.map(p => dot(p, 4)).join('') : dot(pts[pts.length - 1], 4);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="体重の折れ線グラフ。${md(pts[0].d)} ${fmt(pts[0].w)}kg から ${md(pts[pts.length - 1].d)} ${fmt(pts[pts.length - 1].w)}kg">
    ${grid}${xl}${gl}
    <path d="${pts.map((p, i) => (i ? 'L' : 'M') + x(p.d).toFixed(1) + ' ' + y(p.w).toFixed(1)).join('')}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <g id="wHover" hidden><line y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)"/><circle r="6" fill="var(--chart)" stroke="var(--card)" stroke-width="2"/></g>
  </svg><div class="tip" id="wTip" hidden></div>`;
  const hover = box.querySelector('#wHover'), tip = box.querySelector('#wTip');
  const show = e => { // 指やカーソルにいちばん近い日の値を出す
    const px = (e.clientX - box.getBoundingClientRect().left) * W / box.clientWidth;
    let best = pts[0]; for (const p of pts) if (Math.abs(x(p.d) - px) < Math.abs(x(best.d) - px)) best = p;
    const cx = x(best.d), cy = y(best.w), k = box.clientWidth / W;
    hover.removeAttribute('hidden'); hover.querySelector('line').setAttribute('x1', cx); hover.querySelector('line').setAttribute('x2', cx);
    hover.querySelector('circle').setAttribute('cx', cx); hover.querySelector('circle').setAttribute('cy', cy);
    tip.hidden = false; tip.innerHTML = `${md(best.d, years)}<b>${fmt(best.w)}kg</b>`;
    tip.style.left = Math.min(Math.max(cx * k, 56), box.clientWidth - 56) + 'px'; tip.style.top = Math.max(0, cy * k - 40) + 'px';
  };
  const hide = () => { hover.setAttribute('hidden', ''); tip.hidden = true; };
  box.onpointermove = show; box.onpointerdown = show; box.onpointerleave = hide;
}

/* ---------- メモリー（よく食べるものを記録から覚える） ---------- */
function memory() {
  if (memCache) return memCache;
  const m = new Map();
  for (const [d, list] of Object.entries(state.meals)) for (const e of list) {
    if (e.foodId == null) continue;
    let r = m.get(e.foodId); if (!r) m.set(e.foodId, r = { id: e.foodId, name: e.name, n: 0, last: '', by: {} });
    const b = r.by[e.meal] || (r.by[e.meal] = { n: 0, d: '', e });
    r.n++; b.n++;
    if (d >= b.d) { b.d = d; b.e = e; }
    if (d >= r.last) { r.last = d; r.name = e.name; }
  }
  return memCache = m;
}
// その食事で2回以上食べていて、きょうはまだ記録していないもの
function suggest(meal, dayList) {
  const have = new Set(dayList.filter(e => e.meal === meal).map(e => e.foodId));
  return [...memory().values()].filter(r => r.by[meal] && r.by[meal].n >= 2 && !have.has(r.id))
    .sort((a, b) => b.by[meal].n - a.by[meal].n || (a.by[meal].d < b.by[meal].d ? 1 : -1)).slice(0, 5);
}
const amountShort = e => e.unit === 'g' ? `${fmt(e.grams)}g` : `${e.unit}${e.qty === 1 ? '' : '×' + fmt(e.qty)}`;
// 栄養値は、食品データが今もあれば最新のものに合わせる（マイ食品を直したあとも正しく入る）

  }

}

function weekCard() {

  const top = Math.max(g * 1.25, ...vals), avg = logged.length ? logged.reduce((a, b) => a + b, 0) / logged.length : 0;
  let streak = 0; for (let d = state.meals[dayStr()] ? dayStr() : addDays(dayStr(), -1); state.meals[d]; d = addDays(d, -1)) streak++;
  return `<div class="grp"><h2><b>この7日間</b><span class="num">${logged.length ? `平均 ${kc(avg)} kcal（記録した${logged.length}日）` : ''}</span></h2>

- 1日の目標: {goal_kcal}kcal（たんぱく質{goal_p}g・脂質{goal_f}g・炭水化物{goal_c}g）
- ここまでの摂取: {eaten_kcal}kcal（たんぱく質{eaten_p}g・脂質{eaten_f}g・炭水化物{eaten_c}g）
- 残り: {rest_kcal}kcal（たんぱく質{rest_p}g・脂質{rest_f}g・炭水化物{rest_c}g）
- きょう食べたもの: {eaten_list}

# 好み・条件
{prefs}
- よく食べる食品: {favorites}

# お願い
- この食事は{meal_kcal}kcal前後を目安に、残りのPFCのうち足りていないものを補える内容にしてください
- きょう食べたものと重なりすぎないようにしてください
- 各レシピに、材料と分量（1人前）、作り方（手短に）、所要時間を書いてください
- 最後に、各レシピの1人前の栄養を次の形式で1行ずつ書いてください（アプリに取り込むので形式を守ってください）
めしログ: 料理名 | 1人前の重さg | kcal | たんぱく質g | 脂質g | 炭水化物g`;
function recipePrompt(meal) {
  const list = state.meals[curDay] || [], t = sumEntries(list), g = targets(), rest = k => Math.max(0, Math.round(g[k] - t[k]));
  const open = ['breakfast', 'lunch', 'dinner'].filter(m => m === meal || !list.some(e => e.meal === m)).length || 1;
  const fav = [...memory().values()].sort((a, b) => b.n - a.n).slice(0, 12).map(r => r.name);
  const prefs = state.settings.recipe.prefs.trim();
  const v = {
    meal: mealName(meal), date: dayLabel(curDay),
    goal_kcal: Math.round(g.kcal), goal_p: Math.round(g.p), goal_f: Math.round(g.f), goal_c: Math.round(g.c),
    eaten_kcal: Math.round(t.kcal), eaten_p: Math.round(t.p), eaten_f: Math.round(t.f), eaten_c: Math.round(t.c),
    rest_kcal: rest('kcal'), rest_p: rest('p'), rest_f: rest('f'), rest_c: rest('c'),
    meal_kcal: meal === 'snack' ? Math.min(rest('kcal'), 200) : Math.round(rest('kcal') / open),
    eaten_list: list.length ? list.map(e => `${e.name} ${fmt(e.grams)}g`).join('、') : 'まだありません',
    favorites: fav.length ? fav.join('、') : '（まだ記録が少ないのでおまかせ）',
    prefs: prefs ? prefs.split('\n').map(l => '- ' + l.trim()).filter(l => l.length > 2).join('\n') : '- 特になし',
  };
  return (state.settings.recipe.template || DEFAULT_TEMPLATE).replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
}
const mealSeg = (name, cur) => `<div class="seg">${MEALS.map(([m, n]) => `<label class="pick"><input type="radio" name="${name}" value="${m}" ${m === cur ? 'checked' : ''}><span>${n}</span></label>`).join('')}</div>`;
function openRecipe(meal) {
  openSheet(`<h2>レシピをAIに相談<button type="button" class="text" data-act="close">閉じる</button></h2>
    <div class="f"><span>どの食事のレシピ？</span>${mealSeg('rmeal', meal)}</div>
    <label class="f"><span>プロンプト（この場で書き足せます）</span><textarea id="rp" rows="11">${esc(recipePrompt(meal))}</textarea></label>
    <p class="note">コピーして ChatGPT や Claude などに貼り付けてください。好みや文面は「設定」で変えられます。</p>
    <div class="acts"><button class="primary">プロンプトをコピー</button></div>
    <div class="two">${navigator.share ? '<button type="button" data-act="recipe-share">共有する</button>' : '<span></span>'}<button type="button" data-act="ai-import">AIの回答を取り込む</button></div>`,
    { type: 'recipe', meal }, true);
}
acts.recipe = () => {
  const h = new Date().getHours(), list = state.meals[curDay] || [];
  const byTime = h < 10 ? 'breakfast' : h < 15 ? 'lunch' : 'dinner';
  openRecipe(curDay === dayStr() ? byTime : ['breakfast', 'lunch', 'dinner'].find(m => !list.some(e => e.meal === m)) || 'dinner');
};
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try { const ta = $('#rp'); ta.focus(); ta.select(); return document.execCommand('copy'); } catch (e) { return false; }
}
submits.recipe = async () => { toast(await copyText($('#rp').value) ? 'プロンプトをコピーしました。AIに貼り付けてください' : 'コピーできませんでした。文面を長押しして選択してください'); };
acts['recipe-share'] = () => { navigator.share({ text: $('#rp').value }).catch(() => {}); };
acts['tpl-reset'] = () => { $('#tplText').value = DEFAULT_TEMPLATE; toast('初期の文面に戻しました。「保存する」で確定します'); };
document.addEventListener('submit', e => {
  if (e.target.id !== 'rForm') return;
  e.preventDefault();
  const f = new FormData(e.target), tpl = String(f.get('template')).trim();
  state.settings.recipe = { prefs: String(f.get('prefs')).trim(), template: tpl === DEFAULT_TEMPLATE ? '' : tpl };
  save(); render(); toast('レシピ提案の設定を保存しました');
});

/* ---------- AIの回答から取り込む ---------- */
function parseAI(text) {
  const out = [], n = s => { const x = parseFloat(String(s || '').replace(/,/g, '').replace(/^[^\d.]*/, '')); return Number.isFinite(x) && x >= 0 ? x : 0; };
  for (const line of String(text).normalize('NFKC').split('\n')) {
    const m = line.match(/めしログ\s*:\s*(.+)/); if (!m) continue;
    const c = m[1].split('|').map(s => s.replace(/[*`]/g, '').trim());
    if (c.length < 3 || !c[0] || c[0] === '料理名') continue;
    out.push({ name: c[0].slice(0, 60), g: n(c[1]) || 100, kcal: n(c[2]), p: n(c[3]), f: n(c[4]), c: n(c[5]) });
  }
  return out;
}
function renderAI() {
  const items = sheetCtx.items = parseAI($('#aiText').value);
  $('#aiRes').innerHTML = items.length ? `<div class="card">${items.map((x, i) => `<label class="row"><input type="checkbox" name="pick" value="${i}" ${items.length === 1 ? 'checked' : ''} style="width:22px;height:22px;flex:none;accent-color:var(--p2)">
    <span class="tx"><b>${esc(x.name)}</b><small>1人前 ${fmt(x.g)}g・P${fmt(x.p)} F${fmt(x.f)} C${fmt(x.c)}</small></span><span class="kc">${kc(x.kcal)}<small>kcal</small></span></label>`).join('')}</div>`
    : $('#aiText').value.trim() ? '<p class="note bad">「めしログ: 料理名 | 重さ | kcal | P | F | C」の形の行が見つかりませんでした。</p>' : '';
}
acts['ai-import'] = () => {
  const meal = sheetCtx && sheetCtx.meal || 'dinner';
  openSheet(`<h2>AIの回答を取り込む<button type="button" class="text" data-act="close">閉じる</button></h2>
    <label class="f"><span>AIの回答を貼り付け</span><textarea id="aiText" rows="6" placeholder="回答をまるごと貼り付けてください。「めしログ: 料理名 | 重さ | kcal | P | F | C」の行だけを読み取ります。"></textarea></label>
    <div id="aiRes"></div>
    <div class="f"><span>記録する食事</span>${mealSeg('meal', meal)}</div>
    <p class="note">選んだ料理は「1人前」の単位つきでマイ食品に登録されます。AIの栄養値は推定なので、目安として使ってください。</p>
    <div class="acts"><button type="button" data-act="ai-reg">登録だけする</button><button class="primary">登録して記録する</button></div>`,
    { type: 'ai', meal, items: [] }, true);
};
function registerAI() { // 選んだ料理をマイ食品にする（同じ名前があれば上書き）
  const picked = [...$('#sheetForm').querySelectorAll('[name=pick]:checked')].map(c => sheetCtx.items[+c.value]).filter(Boolean);
  return picked.map(x => {
    const k = 100 / x.g, r2 = v => Math.round(v * k * 100) / 100, old = state.custom.find(c => c.name === x.name);
    const food = { id: old ? old.id : 'c:' + uid(), name: x.name, kcal: r2(x.kcal), p: r2(x.p), f: r2(x.f), c: r2(x.c), unitLabel: '1人前', unitG: x.g };
    if (old) Object.assign(old, food); else state.custom.unshift(food);
    return food;
  });
}
acts['ai-reg'] = () => {
  const foods = registerAI(); if (!foods.length) { toast('取り込む料理を選んでください'); return; }
  save(); closeSheet(); render(); toast(`${foods.length}品をマイ食品に登録しました`);
};
submits.ai = form => {
  const foods = registerAI(); if (!foods.length) { toast('取り込む料理を選んでください'); return; }
  addItems(form.get('meal'), foods.map(x => ({ foodId: x.id, name: x.name, grams: x.unitG, qty: 1, unit: '1人前', unitG: x.unitG, kcal: x.kcal, p: x.p, f: x.f, c: x.c })), `${foods.length}品を${mealName(form.get('meal'))}に記録しました`);
};
$('#sheetForm').addEventListener('input', e => {
  if (!sheetCtx) return;
  if (sheetCtx.type === 'recipe' && e.target.name === 'rmeal') { sheetCtx.meal = e.target.value; $('#rp').value = recipePrompt(e.target.value); }
  if (sheetCtx.type === 'ai' && e.target.id === 'aiText') renderAI();
  if (sheetCtx.type === 'ai' && e.target.name === 'meal') sheetCtx.meal = e.target.value;
});

/* ---------- 起動 ---------- */
render();
loadDB();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
